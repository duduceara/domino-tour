<!doctype html><meta charset="utf-8"><title>Homologação Tela 03</title><style>body{margin:0;background:#ddd;font:13px system-ui}main{display:flex;gap:12px}iframe{display:block;border:0}output{display:block;max-width:430px;white-space:pre-wrap}</style><main></main><script>
const sizes=[[390,704],[320,568],[360,640],[375,667],[390,844],[412,915],[430,932],[412,745]];
for(const[w,h]of sizes){const section=document.createElement('section');section.innerHTML='<h2>'+w+'×'+h+'</h2><output>Aguardando…</output>';const f=document.createElement('iframe');f.width=w;f.height=h;section.append(f);document.querySelector('main').append(section);f.onload=()=>setTimeout(()=>{const result={width:w,height:h,checks:0,errors:[]};try{
 const d=f.contentDocument,win=f.contentWindow,root=d.querySelector('#match-setup'),flow=d.querySelector('#entry-flow'),dialog=d.querySelector('#config03-dialog');
 const check=(ok,msg)=>{result.checks++;if(!ok)result.errors.push(msg)};
 const storage=()=>JSON.stringify(Object.keys(win.localStorage).sort().map(k=>[k,win.localStorage.getItem(k)]));const beforeStorage=storage();
 const art02=()=>[...d.querySelectorAll('.official-presentation .official02-slice')].map(e=>{const r=e.getBoundingClientRect();return [e.className,r.x,r.y,r.width,r.height]});const before02=JSON.stringify(art02());
 function click(selector){const b=typeof selector==='string'?root.querySelector(selector):selector;check(!!b,'controle ausente '+selector);if(!b)return;b.scrollIntoView({block:'center'});const r=b.getBoundingClientRect();check(r.width>=23.9&&r.height>=23.9,'alvo pequeno '+(b.getAttribute('aria-label')||b.textContent));check(b.contains(d.elementFromPoint(r.x+r.width/2,r.y+r.height/2)),'oclusão '+(b.dataset.configAction||b.dataset.configField));b.click()}
 const closeDialog=()=>{if(dialog.open)dialog.querySelector('button').click()};
 function geometry(label){const rr=root.getBoundingClientRect();check(rr.width<=w+.5,'largura '+label);for(const b of root.querySelectorAll('button:not(.config03-dialog button)')){if(!b.getClientRects().length)continue;b.scrollIntoView({block:'center'});const q=b.getBoundingClientRect();check(q.x>=-.5&&q.right<=w+.5&&q.y>=-.5&&q.bottom<=h+.5,'limites '+label+' '+(b.dataset.configAction||b.dataset.configField));check(b.contains(d.elementFromPoint(q.x+q.width/2,q.y+q.height/2)),'hit '+label)}for(const slice of root.querySelectorAll('.config03-window')){if(!slice.getClientRects().length)continue;const r=slice.getBoundingClientRect(),rat=getComputedStyle(slice).aspectRatio.split('/').map(Number);check(Math.abs(r.height-r.width*rat[1]/rat[0])<.15,'proporção '+label)}root.scrollTop=0}
 check(flow.dataset.step==='2','fluxo mínimo de carregamento');d.querySelector('[data-official-action="quick"]').click();check(!root.hidden,'Jogar Rápido abre Tela 03');check(root.dataset.mode==='offline','Offline inicial');check(flow.inert,'Tela 02 sem foco por trás');
 check(root.querySelector('[data-config-field="difficulty"][aria-pressed="true"]').dataset.configValue==='medium','Médio inicial');check(root.querySelector('[data-config-field="target"][aria-pressed="true"]').dataset.configValue==='200','200 inicial');geometry('offline');
 for(const v of ['easy','medium','hard']){click('[data-config-field="difficulty"][data-config-value="'+v+'"]');check(root.querySelectorAll('[data-config-field="difficulty"][aria-pressed="true"]').length===1,'dificuldade única');check(root.querySelector('[data-config-field="difficulty"][data-config-value="'+v+'"]').getAttribute('aria-pressed')==='true','dificuldade alterada')}
 click('[data-config-field="target"][data-config-value="100"]');click('[data-config-field="target"][data-config-value="300"]');check(dialog.open,'300 informa limite real');check(root.querySelector('[data-config-field="target"][data-config-value="100"]').getAttribute('aria-pressed')==='true','300 não substitui escolha');closeDialog();
 for(const v of ['green','red','blue','wood','purple']){click('[data-config-field="tableStyle"][data-config-value="'+v+'"]');check(root.querySelectorAll('[data-config-field="tableStyle"][aria-pressed="true"]').length===1,'mesa única')}
 click('[data-config-action="next-style"]');check(root.querySelector('[data-config-field="tableStyle"][data-config-value="green"]').getAttribute('aria-pressed')==='true','seta avança e retorna ao início');click('[data-config-action="previous-style"]');check(root.querySelector('[data-config-field="tableStyle"][data-config-value="purple"]').getAttribute('aria-pressed')==='true','seta anterior');
 click('[data-config-action="help"]');check(dialog.open,'ajuda');closeDialog();click('[data-config-action="start"]');check(dialog.textContent.includes('Identificação em desenvolvimento')&&dialog.textContent.includes('Difícil')&&dialog.textContent.includes('100 pontos')&&dialog.textContent.includes('Roxo'),'transição segura preserva escolhas');check(d.body.dataset.entry!=='playing','não inicia partida ou Tela 04 fictícia');closeDialog();
 click('[data-config-action="online"]');check(root.dataset.mode==='online','online selecionado');check(!root.querySelector('.config03-banner').hidden,'aviso online');check([...root.querySelectorAll('.config03-window>img')].every(i=>i.src.includes('screen-03-online.png')),'uma arte online ativa');geometry('online');
 for(const action of ['online-quick','online-create','online-join','start']){click('[data-config-action="'+action+'"]');check(dialog.querySelector('p').textContent==='Modo online em desenvolvimento. Em breve!','bloqueio honesto '+action);closeDialog()}
 click('[data-config-action="offline"]');check(root.dataset.mode==='offline','volta Offline');check([...root.querySelectorAll('.config03-window>img')].every(i=>i.src.includes('screen-03-offline.png')),'uma arte offline ativa');check(root.querySelector('[data-config-field="difficulty"][data-config-value="hard"]').getAttribute('aria-pressed')==='true','dificuldade preservada');check(root.querySelector('[data-config-field="target"][data-config-value="100"]').getAttribute('aria-pressed')==='true','meta preservada');check(root.querySelector('[data-config-field="tableStyle"][data-config-value="purple"]').getAttribute('aria-pressed')==='true','mesa preservada');
 d.documentElement.style.fontSize='200%';geometry('fonte HTML 200%');d.documentElement.style.fontSize='';click('[data-config-action="back"]');check(root.hidden&&!flow.inert,'Voltar restaura apresentação');check(JSON.stringify(art02())===before02,'geometria Tela 02 preservada');check(storage()===beforeStorage,'armazenamento local preservado');d.querySelector('[data-official-action="quick"]').click();check(root.dataset.mode==='offline','reabertura Offline');check(root.querySelector('[data-config-field="target"][data-config-value="100"]').getAttribute('aria-pressed')==='true','preferências preservadas ao reabrir');root.scrollTop=0;
 }catch(e){result.errors.push(e.stack||e.message)}window.results??=[];window.results.push(result);section.querySelector('output').textContent=(result.errors.length?'FALHOU\n'+result.errors.join('\n'):'PASS — '+result.checks+' verificações, Offline/Online, escolhas e Tela 02 preservada');},4300);f.src='/web/index.html'}
</script>
