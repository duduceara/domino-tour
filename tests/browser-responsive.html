<!doctype html><meta charset="utf-8"><title>M01 PointerEvent browser QA</title><style>#results{position:fixed;right:0;top:0;width:400px;max-height:260px;overflow:auto;z-index:5;background:white}#frame{position:fixed;left:0;top:0}</style><pre id="results">Running</pre><iframe id="frame" style="border:0;width:740px;height:309px"></iframe><script type="module">
const f=document.querySelector('#frame'),out=document.querySelector('#results'),results=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));const log=r=>{results.push(r);out.textContent=JSON.stringify(results,null,2)};
f.src='../web/index.html';await new Promise(r=>f.onload=r);let d=f.contentDocument;
async function human(){for(let i=0;i<120;i++){if(d.querySelector('#hand button:not(:disabled)'))return true;await wait(100)}return false}
function pointer(el,type,at,id=1){el.dispatchEvent(new f.contentWindow.PointerEvent(type,{bubbles:true,pointerId:id,isPrimary:true,button:0,clientX:at.x,clientY:at.y,pointerType:'touch'}))}
function tap(el){const r=el.getBoundingClientRect(),at={x:r.x+r.width/2,y:r.y+r.height/2};pointer(el,'pointerdown',at);pointer(el,'pointerup',at)}
try{
if(!await human())throw Error('No human turn');const before=d.querySelector('#scores').textContent+Array.from(d.querySelectorAll('#hand button')).map(x=>x.dataset.tileId).join(',');
for(const [w,h] of [[740,280],[280,740],[740,292],[292,740],[740,309],[309,740],[568,320],[320,568],[915,412],[412,915],[1024,768],[1920,1080]]){f.style.width=w+'px';f.style.height=h+'px';for(let i=0;i<40;i++){if(parseFloat(d.querySelector('#app').style.width)===Math.max(w,h)&&parseFloat(d.querySelector('#app').style.height)===Math.min(w,h)&&d.querySelector('#app').dataset.rotated===String(h>w))break;await wait(100)}await wait(100);const t=d.querySelector('#table'),ess=[...d.querySelectorAll('header button,#hand button,.seat,.play-controls button')],clip=ess.filter(el=>{const r=el.getBoundingClientRect();return r.left<-.5||r.top<-.5||r.right>w+.5||r.bottom>h+.5}).map(el=>el.id||el.className);log({w,h,inner:[f.contentWindow.innerWidth,f.contentWindow.innerHeight],visual:[f.contentWindow.visualViewport.width,f.contentWindow.visualViewport.height],app:[d.querySelector('#app').style.width,d.querySelector('#app').style.height],geometry:t.dataset.geometry,table:[t.clientWidth,t.clientHeight],clipped:clip,statePreserved:before===d.querySelector('#scores').textContent+Array.from(d.querySelectorAll('#hand button')).map(x=>x.dataset.tileId).join(',')})}
f.style.width='309px';f.style.height='740px';for(let i=0;i<40;i++){if(d.querySelector('#app').dataset.rotated==='true'&&d.querySelector('#app').style.height==='309px')break;await wait(100)}await wait(100);let tile=d.querySelector('#hand button:not(:disabled)');tap(tile);let selected=d.querySelector('#hand .selected');if(!selected)throw Error('No selection after rotation');const ends=[...d.querySelectorAll('.endpoint:not(:disabled)')];log({selectionAfterRotation:true,ends:ends.length});const count=d.querySelectorAll('#hand button').length;if(ends.length===1)tap(selected);else ends[0].click();log({humanPlayCommitted:d.querySelectorAll('#hand button').length===count-1});
if(!await human())throw Error('No subsequent human turn');tile=d.querySelector('#hand button:not(:disabled)');tap(tile);selected=d.querySelector('#hand .selected');const end=d.querySelector('.endpoint:not(:disabled)');const a=selected.getBoundingClientRect(),b=end.getBoundingClientRect(),n=d.querySelectorAll('#hand button').length;pointer(selected,'pointerdown',{x:a.x+a.width/2,y:a.y+a.height/2});pointer(selected,'pointermove',{x:b.x+b.width/2,y:b.y+b.height/2});pointer(selected,'pointerup',{x:b.x+b.width/2,y:b.y+b.height/2});log({dragAfterRotation:d.querySelectorAll('#hand button').length===n-1});
}catch(e){log({error:e.message})}out.dataset.done='true';
</script>
