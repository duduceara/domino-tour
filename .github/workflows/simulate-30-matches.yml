name: Simulate 60 domino matches
on:
  workflow_dispatch:
  push:
    branches: [feature/mobile-touch-v1]
    paths:
      - 'tests/automated-30-matches.test.mjs'
      - 'dist/src/engine.js'
      - 'dist/src/bots.js'
      - '.github/workflows/simulate-30-matches.yml'
permissions:
  contents: read
jobs:
  sixty-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate sixty complete matches against actual game engine
        run: node --test tests/automated-30-matches.test.mjs
