name: DOMINÓ TOUR M06 table interaction guards
on:
  workflow_dispatch:
  push:
    branches: [feature/mobile-touch-v1]
    paths:
      - 'tests/m06-table-interaction-guards.test.mjs'
      - 'web/layout.css'
      - 'web/app.js'
      - 'web/index.html'
      - 'web/approved-interfaces.json'
      - '.github/workflows/m06-table-guards.yml'
permissions:
  contents: read
jobs:
  table-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run table interaction regression guards
        run: node --test tests/m06-table-interaction-guards.test.mjs
